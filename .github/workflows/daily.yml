name: daily

on:
  schedule:
    # arXiv 每天 00:00 ET 公告；01:30 UTC ≈ 09:30 CST，留足解析时间
    - cron: '30 1 * * *'
  # push 到 main 也触发一次，方便手动验证；bot 自己的提交会被下面的 if 跳过
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - 'public/figs/**'
      - 'public/*.apk'
      - '**.md'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 (YYYY-MM-DD)，留空用今天 (UTC)'
        required: false
        default: ''

permissions:
  contents: write     # 回写 data/ 与 figs/
  pages: write        # 发布到 GitHub Pages
  id-token: write

concurrency:
  group: daily-pages
  cancel-in-progress: false

jobs:
  build:
    # 防止 bot 提交触发新一轮（虽然 GITHUB_TOKEN 推送本身不会递归，双保险）
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python3 -m pip install --quiet --target pylib tiktoken Pillow

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(date -u +%F); fi
          echo "DATE=$D" >> "$GITHUB_ENV"
          PYTHONPATH=./pylib python3 pipeline/run.py --date "$D" --no-push

      - name: Commit data
        run: |
          git config user.name  "amadeus-bot"
          git config user.email "amadeus-bot@users.noreply.github.com"
          git add public/data public/figs
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "daily: ${DATE}"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
