<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安装 AMADEUS</title>
<style>
body{margin:0;background:#191a1d;color:#e8e2d4;font-family:"Noto Sans CJK SC",system-ui,sans-serif;
  display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.card{max-width:420px;width:100%}
h1{font-size:20px;font-weight:600;margin:0 0 6px}
p{font-size:13px;line-height:1.9;color:#aaa69e;margin:0 0 12px}
a.btn{display:block;text-align:center;background:#b94b43;color:#1a1210;text-decoration:none;
  font-weight:600;padding:15px;border-radius:4px;margin:22px 0 10px;font-size:15px}
a.btn:active{background:#a03d35}
code{font-family:ui-monospace,monospace;font-size:11px;color:#5f5e59;word-break:break-all}
ol{padding-left:18px;color:#aaa69e;font-size:12.5px;line-height:2}
</style></head><body>
<div class="card">
  <h1>AMADEUS · 每日文献</h1>
  <p>13 MB · Android 8+ · 已签名</p>

  <a class="btn" href="amadeus-daily.apk" download>下载 APK</a>

  <ol>
    <li>下载完成后点开文件</li>
    <li>提示「不允许安装」→ 设置 → <b>允许来自此来源的应用</b></li>
    <li>返回 → 安装</li>
    <li>打开 App → 右下角 <b>⚙</b> → 填 DeepSeek API Key 和研究方向</li>
    <li>点「立即生成今天的日报」</li>
  </ol>

  <p style="margin-top:18px;font-size:11.5px;color:#5f5e59">
    装好后每次打开都会自动拉取最新一天的论文，断网时显示包内快照。
  </p>
  <p><code>amadeus-daily.apk</code></p>
</div>
</body></html>
